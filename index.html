<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英文教材練習器 - 步驟二修正版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #f8fafc; color: #1e293b; }
        .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #e2e8f0; }
        h1 { text-align: center; color: #0f172a; }
        
        .step-box { padding: 15px; border-bottom: 1px solid #f1f5f9; margin-bottom: 10px; }
        .step-title { font-size: 1.1em; font-weight: bold; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        
        input[type="file"] { padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; width: 100%; cursor: pointer; background: #fff; }
        select { width: 100%; padding: 12px; font-size: 1.1em; border-radius: 8px; border: 2px solid #cbd5e1; cursor: pointer; background-color: #ffffff; }
        select:focus { border-color: #2563eb; outline: none; }

        #textDisplay { background: white; height: 350px; overflow-y: auto; padding: 25px; border-radius: 12px; border: 1px solid #e2e8f0; line-height: 2; font-size: 1.25em; margin-bottom: 20px; }
        .sentence { cursor: pointer; padding: 2px 4px; border-radius: 4px; transition: 0.2s; border-bottom: 2px solid transparent; }
        .sentence:hover { background-color: #f1f5f9; color: #2563eb; }
        .highlight { background-color: #fef08a; font-weight: bold; border-bottom-color: #eab308; color: #000; }

        .control-panel { display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        
        button { padding: 12px 18px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 0.95em; }
        .btn-nav { background-color: #64748b; color: white; }
        .btn-play { background-color: #2563eb; color: white; }
        .btn-pause { background-color: #f59e0b; color: white; }
        .btn-stop { background-color: #ef4444; color: white; }
        .btn-record { background-color: #dc2626; color: white; }
        .btn-dict { background-color: #9333ea; color: white; }
        
        button:hover { filter: brightness(1.1); }
        .recording-on { animation: pulse 1.5s infinite; background-color: #b91c1c !important; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        #audioPlayback { width: 100%; margin-top: 15px; display: none; }

        /* 聽寫視窗 */
        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
        .modal-content { background: white; margin: 10% auto; padding: 30px; border-radius: 20px; width: 90%; max-width: 600px; text-align: center; position: relative; }
        .dictation-input { font-size: 1.1em; padding: 5px; width: 110px; border: none; border-bottom: 2px solid #9333ea; text-align: center; outline: none; margin: 0 5px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎧 英文教材互動練習器</h1>

        <div class="step-box">
            <div class="step-title">📂 步驟一：選擇文章檔案 (.docx 或 .txt)</div>
            <input type="file" id="fileInput" accept=".docx, .txt" multiple>
        </div>

        <div class="step-box">
            <div class="step-title">📄 步驟二：從選單中挑選要練習的文章</div>
            <select id="articleSelect" disabled>
                <option value="">-- 請先完成步驟一上傳檔案 --</option>
            </select>
        </div>
    </div>

    <div id="textDisplay" class="card">
        <p style="color: #94a3b8; text-align: center; margin-top: 140px;">尚未載入文章內容</p>
    </div>

    <div class="card control-panel">
        <div class="btn-row">
            <button class="btn-nav" onclick="changeSentence(-1)">⏮ 上一句</button>
            <button class="btn-play" id="btnPlayAll">▶ 播放全文</button>
            <button class="btn-pause" onclick="pauseSpeech()">⏸ 暫停</button>
            <button class="btn-stop" onclick="stopSpeech()">⏹ 停止</button>
            <button class="btn-nav" onclick="changeSentence(1)">⏭ 下一句</button>
            <button class="btn-dict" style="background-color: #059669;" onclick="window.open('https://wwwaaasea-git.github.io/engreading/test.html', '_blank')">📝 綜合練習測驗</button>
        </div>

        <div class="btn-row">
            <button class="btn-record" id="btnRecord">⏺ 開始錄音練習</button>
            <button class="btn-dict" id="btnStartDict">📝 聽寫測驗挑戰</button>
        </div>

        <audio id="audioPlayback" controls></audio>
    </div>

    <div id="dictationModal" class="modal">
        <div class="modal-content">
            <span style="position:absolute; top:15px; right:20px; font-size:30px; cursor:pointer;" onclick="closeDict()">&times;</span>
            <h2 style="color: #9333ea;">Listen & Write</h2>
            <div id="dictationText" style="font-size: 1.4em; margin: 25px 0; line-height: 2;"></div>
            <p id="dictationFeedback" style="font-weight:bold;"></p>
            <button class="btn-play" style="margin: 0 auto;" onclick="speakDict()">🔄 再聽一次</button>
        </div>
    </div>

    <script>
        // --- 全域變數 ---
        let fileStore = {}; 
        let sentences = [];
        let currentIdx = 0;
        let isAutoPlaying = false;
        const synth = window.speechSynthesis;

        // --- 修正步驟一：上傳與選單更新 ---
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const files = e.target.files;
            if (files.length === 0) return;
            
            const select = document.getElementById('articleSelect');
            select.innerHTML = '<option value="" disabled selected>-- 點擊此處選擇文章 --</option>';
            
            for (let file of files) {
                fileStore[file.name] = file;
                let opt = document.createElement('option');
                opt.value = file.name;
                opt.textContent = file.name;
                select.appendChild(opt);
            }
            select.disabled = false;
            alert("檔案已準備就緒，請執行「步驟二」選擇文章！");
        });

        // --- 修正步驟二：選單執行邏輯 ---
        document.getElementById('articleSelect').addEventListener('change', function() {
            const fileName = this.value;
            const file = fileStore[fileName];
            if (!file) return;

            // 確保停止所有正在進行的播放
            stopSpeech();
            document.getElementById('textDisplay').innerHTML = '<p style="text-align: center; margin-top: 140px;">正在解析內容...</p>';

            const reader = new FileReader();
            
            if (file.name.toLowerCase().endsWith('.docx')) {
                reader.onload = function(e) {
                    mammoth.extractRawText({ arrayBuffer: e.target.result })
                        .then(result => {
                            if (result.value.trim() === "") throw new Error("文件內容為空");
                            processTextToSentences(result.value);
                        })
                        .catch(err => {
                            console.error(err);
                            document.getElementById('textDisplay').innerHTML = '<p style="color:red; text-align:center;">解析錯誤，請確認檔案格式</p>';
                        });
                };
                reader.readAsArrayBuffer(file);
            } else {
                reader.onload = function(e) {
                    processTextToSentences(e.target.result);
                };
                reader.readAsText(file);
            }
        });

        function processTextToSentences(text) {
            // 【新增這一行】將當前文章存入瀏覽器空間，供 test.html 讀取
            sessionStorage.setItem('dynamicArticle', text); 

            // 原本的程式碼保持不變

            // 基礎斷句邏輯
            sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
            const display = document.getElementById('textDisplay');
            display.innerHTML = '';
            
            sentences.forEach((s, i) => {
                let span = document.createElement('span');
                span.className = 'sentence';
                span.id = 's-' + i;
                span.innerText = s.trim() + ' ';
                span.onclick = () => { isAutoPlaying = false; currentIdx = i; playSentence(); };
                display.appendChild(span);
            });
            currentIdx = 0;
        }

        // --- 播放功能 ---
        function playSentence() {
            synth.cancel();
            document.querySelectorAll('.sentence').forEach(el => el.classList.remove('highlight'));
            const target = document.getElementById('s-' + currentIdx);
            if (target) {
                target.classList.add('highlight');
                target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            const utter = new SpeechSynthesisUtterance(sentences[currentIdx]);
            utter.lang = 'en-US';
            utter.rate = 0.9;
            utter.onend = () => {
                if (isAutoPlaying && currentIdx < sentences.length - 1) {
                    currentIdx++;
                    playSentence();
                } else {
                    isAutoPlaying = false;
                }
            };
            synth.speak(utter);
        }

        document.getElementById('btnPlayAll').onclick = () => {
            if (sentences.length === 0) return alert("請先選擇文章！");
            isAutoPlaying = true;
            if (synth.paused) synth.resume();
            else playSentence();
        };

        function pauseSpeech() { isAutoPlaying = false; synth.pause(); }
        function stopSpeech() { 
            isAutoPlaying = false; 
            synth.cancel(); 
            document.querySelectorAll('.sentence').forEach(el => el.classList.remove('highlight'));
        }

        function changeSentence(step) {
            isAutoPlaying = false;
            let next = currentIdx + step;
            if (next >= 0 && next < sentences.length) {
                currentIdx = next;
                playSentence();
            }
        }

        // --- 錄音功能 ---
        let recorder;
        let chunks = [];
        const recBtn = document.getElementById('btnRecord');
        const playBar = document.getElementById('audioPlayback');

        recBtn.onclick = async () => {
            if (!recorder || recorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    recorder = new MediaRecorder(stream);
                    chunks = [];
                    recorder.ondataavailable = e => chunks.push(e.data);
                    recorder.onstop = () => {
                        const blob = new Blob(chunks, { type: 'audio/webm' });
                        playBar.src = URL.createObjectURL(blob);
                        playBar.style.display = 'block';
                    };
                    recorder.start();
                    recBtn.innerText = "⏹ 停止錄音";
                    recBtn.classList.add('recording-on');
                } catch (e) { alert("無法開啟麥克風。"); }
            } else {
                recorder.stop();
                recBtn.innerText = "⏺ 開始錄音練習";
                recBtn.classList.remove('recording-on');
                recorder.stream.getTracks().forEach(t => t.stop());
            }
        };

        // --- 聽寫測驗 ---
        let dictWords = [];
        let solved = 0;
        const modal = document.getElementById('dictationModal');

        document.getElementById('btnStartDict').onclick = () => {
            if (sentences.length === 0) return;
            stopSpeech();
            currentIdx = 0;
            modal.style.display = 'block';
            loadDict();
        };

        function loadDict() {
            const feedback = document.getElementById('dictationFeedback');
            feedback.innerText = '';
            if (currentIdx >= sentences.length) {
                document.getElementById('dictationText').innerText = "🎉 恭喜完成全文挑戰！";
                return;
            }
            speakDict();

            let s = sentences[currentIdx].trim();
            let tokens = s.match(/([a-zA-Z']+)|([^a-zA-Z']+)/g);
            let indices = [];
            tokens.forEach((t, i) => { if(/[a-zA-Z]{3,}/.test(t)) indices.push(i); });

            let count = Math.min(indices.length, indices.length >= 6 ? 3 : 1);
            let picks = indices.sort(() => 0.5 - Math.random()).slice(0, count).sort((a,b)=>a-b);
            
            dictWords = []; solved = 0;
            picks.forEach((idx, i) => {
                dictWords.push(tokens[idx]);
                tokens[idx] = `<input type="text" class="dictation-input" data-idx="${i}" autocomplete="off">`;
            });

            document.getElementById('dictationText').innerHTML = tokens.join('');
            setTimeout(() => document.querySelector('.dictation-input')?.focus(), 100);

            document.querySelectorAll('.dictation-input').forEach(input => {
                input.onkeyup = (e) => {
                    if (e.key === 'Enter') {
                        let i = input.dataset.idx;
                        if (input.value.trim().toLowerCase() === dictWords[i].toLowerCase()) {
                            input.outerHTML = `<span style="color:#16a34a; font-weight:bold;">${dictWords[i]}</span>`;
                            solved++;
                            if (solved === count) {
                                feedback.style.color = "#16a34a"; feedback.innerText = "Correct!";
                                setTimeout(() => { currentIdx++; loadDict(); }, 1000);
                            } else {
                                document.querySelector('.dictation-input')?.focus();
                            }
                        } else {
                            feedback.style.color = "#dc2626"; feedback.innerText = "Wrong spelling!";
                            input.value = '';
                        }
                    }
                };
            });
        }

        function speakDict() {
            synth.cancel();
            const u = new SpeechSynthesisUtterance(sentences[currentIdx]);
            u.lang = 'en-US'; u.rate = 0.8;
            synth.speak(u);
        }

        function closeDict() { modal.style.display = 'none'; synth.cancel(); }
    </script>
</body>
</html>
